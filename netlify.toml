# SAPNET aerobiology dashboard — Netlify configuration

[build]
  publish   = "public"
  functions = "netlify/functions"
  command   = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Friendly API paths in front of the functions
[[redirects]]
  from = "/api/observations"
  to   = "/.netlify/functions/observations"
  status = 200

[[redirects]]
  from = "/api/diagnostics"
  to   = "/.netlify/functions/diagnostics"
  status = 200

[[redirects]]
  from = "/api/health"
  to   = "/.netlify/functions/health"
  status = 200

# A missing asset or data file must return a real 404.
#
# Without these two rules the catch-all below answers /assets/data.js with
# index.html and HTTP 200: the browser sees a successful response whose body is
# HTML, the module fails to parse, and the page dies with no error status anywhere.
# These rules apply only when the file genuinely is not there, because Netlify
# serves an existing static file before it consults any redirect.
[[redirects]]
  from = "/assets/*"
  to   = "/assets/:splat"
  status = 404

[[redirects]]
  from = "/data/*"
  to   = "/data/:splat"
  status = 404

# Single page, no client router — anything else unknown returns the dashboard
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'none'"

# Asset filenames are stable (styles.css, app.js) rather than content-hashed, so they
# must NOT be cached as immutable: a browser that had the old file would keep serving
# it for a year after a redeploy. Netlify sends an ETag, so revalidation costs one
# conditional request and returns 304 when nothing changed.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[functions]
  node_bundler = "esbuild"
